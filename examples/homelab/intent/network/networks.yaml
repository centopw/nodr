apiVersion: nodr/v1alpha1
kind: Network
metadata:
  name: lan
spec:
  zone: lan
  ipv4:
    subnet: 10.0.10.0/24
    gateway: 10.0.10.1
    dhcp: { range: 10.0.10.100-10.0.10.249, leaseTime: 12h }
    static: { range: 10.0.10.10-10.0.10.99 }
  dns: { domain: lan.home.arpa }
---
apiVersion: nodr/v1alpha1
kind: Network
metadata:
  name: dmz
spec:
  vlan: 20
  zone: dmz
  ipv4:
    subnet: 10.0.20.0/24
    gateway: 10.0.20.1
    static: { range: 10.0.20.10-10.0.20.99 }
  dns: { domain: dmz.home.arpa }
  realizeOn: { clusters: [pve-main] }
---
apiVersion: nodr/v1alpha1
kind: Network
metadata:
  name: iot
spec:
  vlan: 30
  zone: iot
  ipv4:
    subnet: 10.0.30.0/24
    gateway: 10.0.30.1
    dhcp: { range: 10.0.30.100-10.0.30.249, leaseTime: 12h }
    static: { range: 10.0.30.10-10.0.30.99 }
  dns: { domain: iot.home.arpa }
