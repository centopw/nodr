# The VM from the design (docs/design/03-resource-model.md, section 3.13).
apiVersion: nodr/v1alpha1
kind: VirtualMachine
metadata:
  name: web-01
  uid: 01J9Z3K4T7M2Q8V5X6N0B1C2D3
  labels:
    nodr/environment: prod
    app: website
  annotations:
    nodr/description: Public website frontend
spec:
  placement:
    cluster: pve-main
    node: auto
    assignedNode: pve2
  identity:
    vmid: 1012
  source:
    template: debian-12-cloud
  resources:
    cpu: { cores: 2, type: x86-64-v2-AES }
    memory: { size: 8Gi }
  disks:
    - name: root
      storage: ceph-vm
      size: 32Gi
      options: { discard: true, ssd: true, iothread: true }
  nics:
    - network: dmz
      mac: BC:24:11:3A:5E:01
      ipv4: { mode: auto, address: 10.0.20.21/24 }
  guest:
    agent: true
    cloudInit:
      user: ops
      authorizedKeys: [ops-team]
    profile: linux-baseline
  policies:
    backup: nightly-7d4w
    updates: security-weekly
  lifecycle:
    powerState: running
    protection: true
    startOnBoot: true
  proxmox:
    machine: q35
    bios: ovmf
    scsiController: virtio-scsi-single
