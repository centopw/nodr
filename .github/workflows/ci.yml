name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24.x", "stable"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      # For the integration tests of internal/engine/opentofu.
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.11.4"
          tofu_wrapper: false
      - name: Verify module cache against go.sum
        run: go mod verify
      - name: Build
        run: go build ./...
      - name: Test
        # With NODR_TEST_TOFU set, the integration tests fail instead of
        # being skipped if tofu is missing.
        env:
          NODR_TEST_TOFU: tofu
        run: go test -race -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.8.0

  engine-code:
    name: Validate example code (OpenTofu ${{ matrix.tofu }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest version that rendered code supports, and a current one.
        tofu: ["1.8.0", "1.11.4"]
    steps:
      - uses: actions/checkout@v5
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ matrix.tofu }}
          tofu_wrapper: false
      - name: Check formatting
        run: tofu fmt -check -diff -recursive examples
      - name: Validate against the provider schema
        run: |
          for dir in examples/*/terraform/*/; do
            echo "::group::$dir"
            tofu -chdir="$dir" init -backend=false -input=false
            tofu -chdir="$dir" validate
            echo "::endgroup::"
          done

  dependencies:
    name: Verify go.sum against the checksum database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache: false
      - name: Regenerate go.sum with checksum database lookups
        run: |
          rm -f go.sum
          go mod tidy
          git diff --exit-code go.mod go.sum

  release-config:
    name: Validate release configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Test the release notes script
        run: scripts/changelog-notes_test.sh
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          install-only: true
      - name: Check the GoReleaser configuration
        run: goreleaser check
      - name: Build a snapshot release without publishing it
        run: goreleaser release --snapshot --clean
