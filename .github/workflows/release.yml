name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      # Create the GitHub Release and upload the archives.
      contents: write
      # Sign the build provenance attestations and store them.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          # GoReleaser reads the tags and the history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          # Build the release without caches that other runs wrote.
          cache: false
      - name: Extract the release notes from CHANGELOG.md
        run: scripts/changelog-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/release-notes.md"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
