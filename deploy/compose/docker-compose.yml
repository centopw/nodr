# Deploy the nodr web control plane with Docker Compose.
#
# nodr creates its own Git workspace on first start. The named volume
# nodr-data holds bootstrap state, the workspace, and the generated KEK when
# no KEK is configured. Copy nodr.env.example to nodr.env (next to this file)
# and fill it in, or leave it empty for browser setup.
services:
  nodr:
    image: ghcr.io/centopw/nodr:latest
    command: ["server", "--data-dir", "/var/lib/nodr", "--addr", "0.0.0.0:8080"]
    ports:
      # Loopback only: put a TLS-terminating reverse proxy in front.
      - "127.0.0.1:8080:8080"
    env_file:
      - nodr.env
    volumes:
      - nodr-data:/var/lib/nodr
    restart: unless-stopped
    # Ledger mode (optional): mount the GitHub App private key as a secret file.
    # Uncomment together with the top-level secrets block below, and set
    # NODR_GITHUB_PRIVATE_KEY_FILE=/run/secrets/github-app-private-key in nodr.env.
    # secrets:
    #   - github-app-private-key

volumes:
  nodr-data:

# Ledger mode (optional): keep the GitHub App private key out of Git. The file
# path is relative to this file.
# secrets:
#   github-app-private-key:
#     file: ./secrets/github-app-private-key.pem
