apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nodr.fullname" . }}
  labels:
    {{- include "nodr.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "nodr.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "nodr.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: nodr
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "server"
            - "--data-dir"
            - "/var/lib/nodr"
            - "--addr"
            - "0.0.0.0:8080"
          env:
            # Every reference is optional. Empty or absent keys leave the
            # variable unset, so the server uses browser setup (or a generated
            # KEK when none is set). Supplying only some of the four
            # NODR_BOOTSTRAP_* keys makes nodr exit before it listens.
            - name: NODR_KEK
              valueFrom:
                secretKeyRef:
                  name: {{ include "nodr.secretName" . }}
                  key: nodr-kek
                  optional: true
            - name: NODR_BOOTSTRAP_WORKSPACE_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "nodr.secretName" . }}
                  key: nodr-bootstrap-workspace-name
                  optional: true
            - name: NODR_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "nodr.secretName" . }}
                  key: nodr-bootstrap-admin-username
                  optional: true
            - name: NODR_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nodr.secretName" . }}
                  key: nodr-bootstrap-admin-password
                  optional: true
            - name: NODR_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "nodr.secretName" . }}
                  key: nodr-bootstrap-token
                  optional: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /var/lib/nodr
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.data.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.data.existingClaim }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "nodr.fullname" . }}-data
          {{- end }}
