{{- if .Values.data.create }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "nodr.fullname" . }}-data
  labels:
    {{- include "nodr.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.data.size }}
  {{- with .Values.data.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
