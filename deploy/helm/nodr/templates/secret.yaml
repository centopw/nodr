{{- if not .Values.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nodr.fullname" . }}-secret
  labels:
    {{- include "nodr.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secret.kek }}
  nodr-kek: {{ .Values.secret.kek | b64enc | quote }}
  {{- end }}
  {{- if .Values.secret.bootstrap.workspaceName }}
  nodr-bootstrap-workspace-name: {{ .Values.secret.bootstrap.workspaceName | b64enc | quote }}
  {{- end }}
  {{- if .Values.secret.bootstrap.adminUsername }}
  nodr-bootstrap-admin-username: {{ .Values.secret.bootstrap.adminUsername | b64enc | quote }}
  {{- end }}
  {{- if .Values.secret.bootstrap.adminPassword }}
  nodr-bootstrap-admin-password: {{ .Values.secret.bootstrap.adminPassword | b64enc | quote }}
  {{- end }}
  {{- if .Values.secret.bootstrap.token }}
  nodr-bootstrap-token: {{ .Values.secret.bootstrap.token | b64enc | quote }}
  {{- end }}
{{- end }}
