# Default values for the nodr chart.
replicaCount: 1

image:
  repository: ghcr.io/centopw/nodr
  # Defaults to Chart appVersion. Set a specific release tag in production.
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  hosts: []
  #   - host: nodr.example.com
  #     paths:
  #       - path: /
  #         pathType: Prefix
  tls: []
  #   - secretName: nodr-tls
  #     hosts:
  #       - nodr.example.com

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# GitHub-backed ledger (opt-in; see docs/guides/production.md section 13).
# Set appId and publicUrl here. The private key and the webhook secret must be
# supplied through existingSecret (keys nodr-github-private-key and
# nodr-github-webhook-secret). The NODR_GITHUB_* variables are all-or-none: a
# partial group makes the server exit, and a missing private-key key stops the
# pod from starting. Leave appId empty for the local workspace.
github:
  # Numeric GitHub App ID. Empty disables ledger mode.
  appId: ""
  # Public base URL, for example https://nodr.example.com. The webhook URL is
  # <publicUrl>/api/v1/integrations/github/webhook.
  publicUrl: ""

# Secret material. Leave every value empty to finish setup in the browser;
# the one-time token is printed to the pod log (kubectl logs). The chart never
# supplies default credentials.
#
# Unattended bootstrap is all-or-none: set all four of bootstrap.* or none.
# Supplying some of them makes the pod exit before it listens. Prefer
# existingSecret populated by your secret manager over literal values here.
secret:
  # Name of an existing Secret. Keys: nodr-kek, nodr-bootstrap-workspace-name,
  # nodr-bootstrap-admin-username, nodr-bootstrap-admin-password,
  # nodr-bootstrap-token, nodr-github-private-key (PEM, mounted as a file when
  # github.appId is set), nodr-github-webhook-secret. Missing keys are treated
  # as unset.
  existingSecret: ""
  # Used only when existingSecret is empty. Base64-encoded 32-byte KEK; leave
  # empty to let nodr generate one under the data volume.
  kek: ""
  bootstrap:
    workspaceName: ""
    adminUsername: ""
    adminPassword: ""
    token: ""

# Persistent data directory mounted at /var/lib/nodr. It holds bootstrap
# state, the Git workspace nodr creates on first start, and the generated KEK
# when no KEK is configured. Back it up with the Git history.
data:
  # Existing PVC to reuse. When set, create is ignored.
  existingClaim: ""
  # Create a PVC named <release>-data when existingClaim is empty.
  create: true
  size: 1Gi
  storageClass: ""
